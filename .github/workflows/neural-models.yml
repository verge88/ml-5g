name: Causal TGN GNN LSTM Transformer comparison

on:
  push:
    branches: [codex/neural-temporal-graph-models]
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_neural5g.py tests/test_semantic5g.py --junitxml=results/neural-controls.xml
      - run: python -m hybrid.fetch_data --output data/granomaly
      - uses: actions/upload-artifact@v4
        with:
          name: neural-pinned-data
          path: data/granomaly/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-controls
          path: results/neural-controls.xml

  models:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        model: [tgn, gnn, lstm, transformer, hgb]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: neural-pinned-data
          path: data/granomaly
      - run: python -m neural5g.benchmark --data data/granomaly --model ${{ matrix.model }} --output results/neural/${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-${{ matrix.model }}
          path: results/neural/${{ matrix.model }}/
          retention-days: 90

  report:
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          pattern: neural-*
          path: inputs
      - run: python -m neural5g.aggregate --input inputs --output results/report
      - uses: actions/upload-artifact@v4
        with:
          name: neural-report
          path: results/report/
          retention-days: 90
