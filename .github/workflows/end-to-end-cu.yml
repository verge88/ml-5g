name: Full isolated 5GC with UE path, guest witness and adaptive CU budget
on:
  push:
    branches: [codex/end-to-end-cu]
    paths: ['e2e5g/**','tests/test_e2e5g.py','.github/workflows/end-to-end-cu.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pytest -q tests/test_e2e5g.py tests/test_cu5g.py --junitxml=checks.xml
      - run: python -m e2e5g.controls --output controls
      - uses: actions/download-artifact@v4
        with:
          pattern: joint-native-70*
          path: inputs
          run-id: 41312205121
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: joint-native-80*
          path: inputs
          run-id: 41317833563
          github-token: ${{ github.token }}
      - run: python -m e2e5g.train_risk --input inputs --output models
      - run: |
          git rev-parse HEAD > source-commit.txt
          find e2e5g -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > source-sha256.txt
          sha256sum hybrid/vendor/stage39_kie.py fullsuite/native_hook.py cu5g/*.py >> source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-frozen-risk-and-controls
          path: |
            models/
            controls/
            checks.xml
            source-commit.txt
            source-sha256.txt
            e2e5g/plan.json
          retention-days: 90
  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        replica: [901,902,903]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: e2e-frozen-risk-and-controls
          path: frozen
      - run: |
          mkdir -p models
          cp frozen/models/risk-models.json models/
          sudo apt-get update -qq
          sudo apt-get install -y cpio
      - name: Full private core and simulated subscriber procedures
        env:
          REPLICA: ${{ matrix.replica }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: bash e2e5g/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-native-${{ matrix.replica }}
          path: out/
          retention-days: 90
  evaluate:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0 dpkt==1.9.8
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-native-*
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: broad-model-*
          path: models
          run-id: 41317833563
          github-token: ${{ github.token }}
      - run: python -m e2e5g.evaluate --input inputs --models models --output results
      - run: cat results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evaluation
          path: results/
          retention-days: 90
