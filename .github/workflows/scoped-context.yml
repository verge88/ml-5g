name: Causal scoped context and bound-observation feasibility
on:
  push:
    branches: [codex/scoped-context]
    paths: ['paper5g/scoped_context.py', 'paper5g/context_prepare.py', 'paper5g/bound_observations.py', 'paper5g/scoped-context-plan.json', 'paper5g/normal_objectives.py', 'semantic5g/analyze.py', 'tests/test_scoped_context.py', '.github/workflows/scoped-context.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_scoped_context.py tests/test_normal_objectives.py tests/test_paper5g.py --junitxml=checks.xml
      - uses: actions/download-artifact@v4
        with:
          name: article-full-numeric-data
          path: original
          run-id: 41096216782
          github-token: ${{ github.token }}
      - run: python -m paper5g.context_prepare --raw data/granomaly --original original/granomaly --output prepared
      - run: |
          git rev-parse HEAD > source-commit.txt
          sha256sum paper5g/scoped_context.py paper5g/context_prepare.py paper5g/bound_observations.py paper5g/scoped-context-plan.json paper5g/normal_objectives.py semantic5g/analyze.py tests/test_scoped_context.py > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-context-data
          path: prepared/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-provenance
          path: |
            checks.xml
            source-commit.txt
            source-sha256.txt
            paper5g/scoped-context-plan.json
            data/granomaly/manifest.json
  models:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goal: [permutation, next, masked]
        arm: [current, global, edge, connection]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: scoped-context-data
          path: prepared
      - run: python -m paper5g.scoped_context --data prepared --output results --goal ${{ matrix.goal }} --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-${{ matrix.goal }}-${{ matrix.arm }}
          path: results/
          retention-days: 90
  report:
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: scoped-*
          path: inputs
      - run: python -m paper5g.scoped_context --data inputs/scoped-context-data --report inputs --output report
      - run: cat report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-report
          path: report/
