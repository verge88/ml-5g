name: Broader native data with retained-model and update-budget controls
on:
  push:
    branches: [codex/joint-broad]
    paths: ['joint5g/broad.py', 'joint5g/broad_collect.py', 'joint5g/broad-plan.json', 'tests/test_joint_broad.py', '.github/workflows/joint-broad.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_joint_broad.py tests/test_joint_deep.py tests/test_joint5g.py tests/test_cu5g.py --junitxml=checks.xml
      - run: |
          git rev-parse HEAD > source-commit.txt
          sha256sum joint5g/*.py joint5g/protocol.json fullsuite/native_hook.py cu5g/common.py cu5g/driver.py hybrid/vendor/stage39_kie.py > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: broad-provenance
          path: |
            checks.xml
            source-commit.txt
            source-sha256.txt
            joint5g/protocol.json
            joint5g/broad-plan.json
  native:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [801,802,803,804,805,806,809,810,811,812,813]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==44.0.2
      - name: Build pinned native core and bound-observation collector
        run: |
          docker build -f cu5g/Dockerfile -t cu5g-native .
          docker build -f fullsuite/Dockerfile -t fullsuite-native .
          docker build -f joint5g/Dockerfile -t joint5g-native .
      - name: Prepare separate laboratory identities and credentials
        run: |
          mkdir -p cu-out cu-control cu-runtime cu-nf cu-witness cu-nfkeys cu-public cu-private
          for role in witness lifecycle; do
            openssl ecparam -name prime256v1 -genkey -noout -out "cu-private/${role}.key"
            openssl ec -in "cu-private/${role}.key" -pubout -out "cu-public/${role}.pub"
          done
          openssl rand -out cu-nfkeys/ausf.key 32
          openssl rand -out cu-nfkeys/nssf.key 32
          chmod 600 cu-private/*.key cu-nfkeys/*.key
          docker image inspect joint5g-native > cu-out/image.json
          cp cu5g/protocol.json cu5g/policy.json cu-out/
          cp joint5g/protocol.json cu-out/joint-protocol.json
          cp cu-public/*.pub cu-out/
      - name: Collect actual CU transport witnesses and local availability interventions
        shell: bash
        run: |
          set -euo pipefail
          python -m cu5g.authority --control cu-control --key cu-private/lifecycle.key > cu-out/authority.log 2>&1 &
          authority_pid=$!
          trap 'kill "$authority_pid" 2>/dev/null || true' EXIT
          docker run -d --name joint-core --network host --add-host nrf:127.0.0.1 --add-host ausf:127.0.0.1 --add-host nssf:127.0.0.1 \
            -e REPLICA=${{ matrix.replica }} -e SOURCE_COMMIT=${{ github.sha }} \
            -v "$PWD/cu-out:/out" -v "$PWD/cu-control:/control" -v "$PWD/cu-runtime:/runtime" \
            -v "$PWD/cu-nf:/nf" -v "$PWD/cu-nfkeys:/nfkeys:ro" -v "$PWD/cu-public:/public:ro" \
            -v "$PWD/cu-witness:/witness" joint5g-native python3 -m joint5g.broad_collect
          docker run -d --name joint-witness --network host --pid=container:joint-core \
            -v "$PWD/cu-control:/control:ro" -v "$PWD/cu-runtime:/runtime:ro" -v "$PWD/cu-witness:/witness" \
            -v "$PWD/cu-private/witness.key:/witnesskey/witness.key:ro" joint5g-native python3 -m cu5g.witness
          core_status="$(docker wait joint-core)"
          docker logs joint-core
          test "$core_status" -eq 0
          witness_status="$(docker wait joint-witness)"
          test "$witness_status" -eq 0
          wait "$authority_pid"
          trap - EXIT
      - name: Save laboratory diagnostics
        if: always()
        run: |
          docker logs joint-core > cu-out/controller.log 2>&1 || true
          docker logs joint-witness > cu-out/witness.log 2>&1 || true
          cp cu-control/lifecycle-response.json cu-out/last-lifecycle-bundle.json 2>/dev/null || true
      - name: Remove only this job's laboratory containers
        if: always()
        run: docker rm -f joint-witness joint-core >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-native-${{ matrix.replica }}
          path: cu-out/
          retention-days: 90
  fit:
    needs: [controls, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [mlp,lstm,transformer]
        composition: [raw,context]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: joint-native-*
          path: inputs
          run-id: 41312205121
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: joint-native-80*
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: joint-native-810
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          name: deep-models
          path: previous
          run-id: 41315712487
          github-token: ${{ github.token }}
      - run: python -m joint5g.broad --input inputs --previous previous --output models --arch ${{ matrix.arch }} --composition ${{ matrix.composition }}
      - uses: actions/upload-artifact@v4
        with:
          name: broad-model-${{ matrix.arch }}-${{ matrix.composition }}
          path: models/
          retention-days: 90
  evaluate:
    needs: fit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: joint-native-81*
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: broad-model-*
          path: models
      - run: python -m joint5g.broad --input inputs --models models --output results
      - run: cat results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-evaluation
          path: results/
          retention-days: 90
