name: Causal early warning of measured service latency on full private 5GC
on:
  push:
    branches: [codex/forecast-5g]
    paths: ['forecast5g/**','tests/test_forecast5g.py','.github/workflows/forecast5g.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pytest -q tests/test_forecast5g.py tests/test_e2e5g.py tests/test_cu5g.py --junitxml=checks.xml
      - run: |
          git rev-parse HEAD > source-commit.txt
          find forecast5g e2e5g cu5g -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > source-sha256.txt
          sha256sum fullsuite/native_hook.py hybrid/vendor/stage39_kie.py >> source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-plan
          path: |
            forecast5g/plan.json
            checks.xml
            source-commit.txt
            source-sha256.txt
          retention-days: 90
  fit:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: forecast-native-120*
          path: inputs
      - name: Fit and freeze without downloading test deployments
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python -m forecast5g.train --input inputs --output models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-models
          path: models/
          retention-days: 90
  evaluate:
    needs: fit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: forecast-native-121*
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          name: forecast-models
          path: frozen
      - run: python -m forecast5g.evaluate --input inputs --models frozen --output results
      - run: cat results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-evaluation
          path: results/
          retention-days: 90
  native:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        replica: [1201,1202,1203,1204,1205,1206,1207,1208,1209,1210,1211,1212]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y cpio
      - name: Measured private core with benign traffic and bounded user-path delay
        env:
          REPLICA: ${{ matrix.replica }}
          SOURCE_COMMIT: ${{ github.sha }}
          FORECAST_SMOKE: '0'
        run: bash forecast5g/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-native-${{ matrix.replica }}
          path: out/
          retention-days: 90
