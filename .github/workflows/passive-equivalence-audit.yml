name: Structural passive-observation equivalence audit
on:
  push:
    branches: [codex/calibrated-probe-study]
    paths: ['analysis/passive_equivalence.py', '.github/workflows/passive-equivalence-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counterexample:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: python -m analysis.passive_equivalence
      - uses: actions/upload-artifact@v4
        with:
          name: structural-passive-equivalence
          path: out/passive-equivalence/
          retention-days: 90
