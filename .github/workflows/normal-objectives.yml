name: Normal-only objectives on known 5G participants
on:
  push:
    branches: [codex/normal-objectives]
    paths: ['paper5g/normal_objectives.py', 'paper5g/normal-objectives-plan.json', 'tests/test_normal_objectives.py', '.github/workflows/normal-objectives.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_normal_objectives.py tests/test_paper5g.py --junitxml=checks.xml
      - run: |
          git rev-parse HEAD > source-commit.txt
          sha256sum paper5g/normal_objectives.py paper5g/normal-objectives-plan.json > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: objectives-provenance
          path: |
            checks.xml
            source-commit.txt
            source-sha256.txt
            paper5g/normal-objectives-plan.json
  objectives:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        goal: [permutation, next, masked]
        mode: [current, history, joint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: article-full-numeric-data
          path: prepared
          run-id: 41096216782
          github-token: ${{ github.token }}
      - run: python -m paper5g.normal_objectives --data prepared --output results --goal ${{ matrix.goal }} --mode ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: objectives-${{ matrix.goal }}-${{ matrix.mode }}
          path: results/
          retention-days: 90
  report:
    needs: objectives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: objectives-*
          path: inputs
      - run: python -m paper5g.normal_objectives --report inputs --output report
      - run: cat report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: objectives-report
          path: report/
