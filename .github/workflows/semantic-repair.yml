name: Registered semantic representation and categorical objective repair
on:
  push:
    branches: [codex/semantic-repair]
    paths: ['paper5g/semantic_repair.py', 'paper5g/semantic-repair-plan.json', 'tests/test_semantic_repair.py', '.github/workflows/semantic-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_semantic_repair.py tests/test_paper5g.py --junitxml=checks.xml
      - uses: actions/download-artifact@v4
        with:
          name: article-full-numeric-data
          path: original
          run-id: 41096216782
          github-token: ${{ github.token }}
      - run: python -m paper5g.semantic_repair --prepare-raw data/granomaly --original original/granomaly --output prepared
      - run: |
          git rev-parse HEAD > source-commit.txt
          sha256sum paper5g/semantic_repair.py paper5g/semantic-repair-plan.json tests/test_semantic_repair.py > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repair-data
          path: prepared/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: repair-provenance
          path: |
            checks.xml
            source-commit.txt
            source-sha256.txt
            paper5g/semantic-repair-plan.json
            data/granomaly/manifest.json
  models:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        encoding: [hash, exact]
        method: [mse_current, mse_global, ce_current, ce_global, isolation_forest, deep_svdd]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: repair-data
          path: prepared
      - run: python -m paper5g.semantic_repair --data prepared --output results --encoding ${{ matrix.encoding }} --method ${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-${{ matrix.encoding }}-${{ matrix.method }}
          path: results/
          retention-days: 90
  report:
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: repair-*
          path: inputs
      - run: python -m paper5g.semantic_repair --report inputs --output report
      - run: cat report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: repair-report
          path: report/
