name: Passive recorded 5G semantic evaluation

on:
  push:
    branches: [codex/passive-semantic-evaluation]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recorded-messages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pytest==8.3.5
      - name: Install saved-capture decoder
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
      - uses: actions/download-artifact@v4
        with:
          name: full-registration
          run-id: 40902826197
          github-token: ${{ github.token }}
          path: inputs/registration
      - uses: actions/download-artifact@v4
        with:
          name: full-external
          run-id: 40902826197
          github-token: ${{ github.token }}
          path: inputs/external
      - name: Verify analysis controls
        run: python -m pytest -q tests/test_semantic5g.py --junitxml=results/semantic-controls.xml
      - name: Fetch pinned public CSV recordings
        run: python -m hybrid.fetch_data --output data/granomaly
      - name: Verify frozen inputs and decode saved capture
        run: python -m semantic5g.prepare --inputs inputs --output decoded
      - name: Evaluate recorded operations and actual JSON bodies
        run: python -m semantic5g.analyze --data data/granomaly --pcap inputs/registration/native-evidence/registration.pcap --h2-json decoded/http2-decoded.json --out results/semantic
      - name: Compare with frozen ML at identical request frames
        run: python -m semantic5g.compare --data data/granomaly --frozen inputs/external --output results/semantic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passive-semantic-evaluation
          path: |
            results/semantic/
            results/semantic-controls.xml
            decoded/decoder-provenance.json
          retention-days: 90
