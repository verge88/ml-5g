name: Independent deployments - fixed ML comparison

on:
  push:
    branches: [codex/independent-deployment-ml]
    paths: ['independent5g/**', 'tests/test_independent5g.py', '.github/workflows/independent-deployment-ml.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          mkdir -p registered
          python -m pytest -q tests/test_independent5g.py tests/test_neural5g.py --junitxml=registered/tests.xml
          cp independent5g/protocol.json registered/
          git rev-parse HEAD > registered/source-commit.txt
          sha256sum independent5g/*.py independent5g/protocol.json neural5g/*.py > registered/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-registered
          path: registered/

  collect:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [601, 602, 603, 604, 605, 606, 607, 608, 609]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==44.0.2 h2==4.2.0
      - name: Build pinned local core and collector
        run: |
          docker build -f cu5g/Dockerfile -t cu5g-native .
          docker build -f fullsuite/Dockerfile -t fullsuite-native .
          docker build -f independent5g/Dockerfile -t independent-native .
      - name: Create separate lab roles
        run: |
          mkdir -p cu-out cu-control cu-runtime cu-nf cu-witness cu-nfkeys cu-public cu-private
          for role in witness lifecycle; do
            openssl ecparam -name prime256v1 -genkey -noout -out "cu-private/${role}.key"
            openssl ec -in "cu-private/${role}.key" -pubout -out "cu-public/${role}.pub"
          done
          openssl rand -out cu-nfkeys/ausf.key 32
          openssl rand -out cu-nfkeys/nssf.key 32
          chmod 600 cu-private/*.key cu-nfkeys/*.key
          cp independent5g/protocol.json cu-out/registered-protocol.json
          cp cu-public/*.pub cu-out/
          docker image inspect independent-native > cu-out/image.json
      - name: Collect fresh deployment using isolated loopback network
        shell: bash
        run: |
          set -euo pipefail
          python -m cu5g.authority --control cu-control --key cu-private/lifecycle.key > cu-out/authority.log 2>&1 &
          authority_pid=$!
          trap 'kill "$authority_pid" 2>/dev/null || true' EXIT
          docker run -d --name cu-core --network none \
            --add-host nrf:127.0.0.1 --add-host ausf:127.0.0.1 --add-host nssf:127.0.0.1 \
            -e REPLICA=${{ matrix.replica }} -e SOURCE_COMMIT=${{ github.sha }} \
            -v "$PWD/cu-out:/out" -v "$PWD/cu-control:/control" -v "$PWD/cu-runtime:/runtime" \
            -v "$PWD/cu-nf:/nf" -v "$PWD/cu-nfkeys:/nfkeys:ro" -v "$PWD/cu-public:/public:ro" \
            -v "$PWD/cu-witness:/witness" independent-native
          docker run -d --name cu-witness --network container:cu-core --pid=container:cu-core \
            -v "$PWD/cu-control:/control:ro" -v "$PWD/cu-runtime:/runtime:ro" -v "$PWD/cu-witness:/witness" \
            -v "$PWD/cu-private/witness.key:/witnesskey/witness.key:ro" independent-native python3 -m cu5g.witness
          core_status="$(docker wait cu-core)"
          docker logs cu-core
          test "$core_status" -eq 0
          witness_status="$(docker wait cu-witness)"
          test "$witness_status" -eq 0
          wait "$authority_pid"
          trap - EXIT
      - name: Save public diagnostics
        if: always()
        run: |
          docker logs cu-core > cu-out/controller.log 2>&1 || true
          docker logs cu-witness > cu-out/witness.log 2>&1 || true
      - name: Remove only this lab
        if: always()
        run: docker rm -f cu-witness cu-core >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-native-${{ matrix.replica }}
          path: cu-out/
          if-no-files-found: error
          retention-days: 30

  models:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        model: [tgn, gnn, lstm, transformer, hgb]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt cryptography==44.0.2 h2==4.2.0
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: independent-native-*
          path: captures
      - run: python -m independent5g.benchmark --data captures --output results --model ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-model-${{ matrix.model }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  report:
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          pattern: independent-model-*
          path: models
      - run: python -m independent5g.report --input models --output final-report
      - run: cat final-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: independent-final-report
          path: final-report/
          retention-days: 30
